<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient: Deep Midnight Cosmic Sky -->
    <radialGradient id="stageBg" cx="50%" cy="32%" r="90%">
      <stop offset="0%" stop-color="#2a2358" />
      <stop offset="45%" stop-color="#14112e" />
      <stop offset="100%" stop-color="#080614" />
    </radialGradient>

    <!-- Warm Golden Ambient Lights -->
    <radialGradient id="goldTopAura" cx="50%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#fcd34d" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#fcd34d" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Golden Aura behind the left and right vectors -->
    <radialGradient id="leftGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fcd34d" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#fcd34d" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="rightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fcd34d" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#fcd34d" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Foil Frame Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="30%" stop-color="#d97706" />
      <stop offset="55%" stop-color="#fcd34d" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Headline Luxury Gold Text Gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef3c7" />
      <stop offset="65%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowTitle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-serif-title {
      font-family: 'DejaVu Serif', Georgia, serif;
      font-weight: bold;
      letter-spacing: 4px;
    }
    .font-sans-sub {
      font-family: 'DejaVu Sans', Ubuntu, sans-serif;
      letter-spacing: 3px;
    }
  </style>

  <!-- 1. Background Scene -->
  <rect width="1200" height="630" fill="url(#stageBg)" />
  <rect width="1200" height="630" fill="url(#goldTopAura)" />
  <rect width="1200" height="630" fill="url(#centerGlow)" />

  <!-- 2. Tiny Ambient Stars -->
  <g fill="#ffffff" opacity="0.45">
    <circle cx="80" cy="70" r="1.5" />
    <circle cx="160" cy="180" r="1.2" />
    <circle cx="110" cy="460" r="1.8" fill="#fcd34d" opacity="0.75" />
    <circle cx="280" cy="560" r="1.3" />
    <circle cx="600" cy="65" r="1.6" fill="#fcd34d" opacity="0.8" />
    <circle cx="1060" cy="80" r="1.4" />
    <circle cx="1120" cy="260" r="1.8" fill="#fcd34d" opacity="0.8" />
    <circle cx="950" cy="540" r="1.3" />
    <circle cx="1140" cy="560" r="1.5" />
    <circle cx="390" cy="90" r="1.2" opacity="0.5" />
    <circle cx="810" cy="90" r="1.2" opacity="0.5" />
  </g>

  <!-- 3. Outer Luxury Gold Border -->
  <rect x="36" y="36" width="1128" height="558" rx="6" fill="none" stroke="url(#goldBorder)" stroke-width="1.6" opacity="0.85" />
  <rect x="48" y="48" width="1104" height="534" rx="4" fill="none" stroke="#b45309" stroke-width="0.7" opacity="0.4" />

  <!-- Corner Deco Accents -->
  <g stroke="#fef3c7" stroke-width="1.5" stroke-opacity="0.85" fill="none">
    <path d="M 48,76 L 48,48 L 76,48" />
    <path d="M 1152,76 L 1152,48 L 1124,48" />
    <path d="M 48,554 L 48,582 L 76,582" />
    <path d="M 1152,554 L 1152,582 L 1124,582" />
  </g>

  <!-- ==================== 4. LEFT: CUNG NHÂN MÃ (CHÒM SAO VÀNG ÁNH KIM) ==================== -->
  <g transform="translate(195, 315)">
    <!-- Soft Glow behind constellation -->
    <circle cx="0" cy="0" r="140" fill="url(#leftGlow)" />
    
    <!-- Exact Constellation Lines & Stars as in BookCover / User Image -->
    <g fill="#fcd34d" stroke="#fcd34d" filter="url(#softGlow)">
      <!-- Connecting Lines -->
      <line x1="-50" y1="-125" x2="3" y2="-52" stroke-width="2" stroke-opacity="0.7" />
      <line x1="3" y1="-52" x2="-35" y2="4" stroke-width="2" stroke-opacity="0.7" />
      <line x1="3" y1="-52" x2="42" y2="60" stroke-width="2" stroke-opacity="0.7" />
      <line x1="-35" y1="4" x2="42" y2="60" stroke-width="2" stroke-opacity="0.7" />
      <line x1="42" y1="60" x2="-8" y2="135" stroke-width="2" stroke-opacity="0.7" />
      <line x1="-8" y1="135" x2="80" y2="168" stroke-width="2" stroke-opacity="0.7" />

      <!-- Glowing Star Nodes -->
      <circle cx="-50" cy="-125" r="5" />
      <circle cx="3" cy="-52" r="5.5" />
      <circle cx="-35" cy="4" r="5" />
      <circle cx="42" cy="60" r="5.5" />
      <circle cx="-8" cy="135" r="5" />
      <circle cx="80" cy="168" r="4.5" />
      
      <!-- Halos for main stars -->
      <circle cx="-50" cy="-125" r="9" fill-opacity="0.25" stroke="none" />
      <circle cx="3" cy="-52" r="10" fill-opacity="0.25" stroke="none" />
      <circle cx="42" cy="60" r="10" fill-opacity="0.25" stroke="none" />
    </g>
  </g>

  <!-- ==================== 5. RIGHT: NÓN TỐT NGHIỆP (VECTOR VÀNG ÁNH KIM) ==================== -->
  <g transform="translate(1005, 315)">
    <!-- Soft Glow behind cap -->
    <circle cx="0" cy="0" r="140" fill="url(#rightGlow)" />
    
    <!-- Exact Graduation Cap Vector as in BookCover / User Image -->
    <g stroke="#fcd34d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#softGlow)">
      <!-- Diamond Top of Cap -->
      <path d="M 0,-70 L 98,-12 L 0,46 L -98,-12 Z" fill="#fcd34d" fill-opacity="0.12" />
      
      <!-- Skull / Crown of Cap -->
      <path d="M -60,6 V 56 C -60,56 -36,88 0,88 C 36,88 60,56 60,56 V 6" />
      
      <!-- Tassel Drop Line -->
      <path d="M 98,-12 V 58" stroke-width="2.5" />
      
      <!-- Tassel Ball End -->
      <circle cx="98" cy="68" r="7.5" fill="#fcd34d" stroke="#fcd34d" stroke-width="1" />
    </g>
  </g>

  <!-- ==================== 6. CENTER: TYPOGRAPHY ==================== -->
  <g transform="translate(600, 0)">
    <!-- Top Sparkle Icon -->
    <text x="0" y="155" text-anchor="middle" fill="#fcd34d" font-size="24" opacity="0.95">✦</text>

    <!-- Eyebrow Tag -->
    <text x="0" y="200" text-anchor="middle" class="font-sans-sub" fill="#fbbf24" font-size="16" font-weight="bold">
      THIỆP MỜI TRÂN TRỌNG
    </text>

    <!-- Star Divider -->
    <text x="0" y="235" text-anchor="middle" fill="#d97706" font-size="13" opacity="0.85">
      ★   ★   ★
    </text>

    <!-- Main Title: LỄ TỐT NGHIỆP -->
    <text x="0" y="325" text-anchor="middle" class="font-serif-title" fill="url(#goldText)" font-size="58" filter="url(#glowTitle)">
      LỄ TỐT NGHIỆP
    </text>
    <text x="0" y="325" text-anchor="middle" class="font-serif-title" fill="url(#goldText)" font-size="58">
      LỄ TỐT NGHIỆP
    </text>

    <!-- Host Name: Ngọc Trâm -->
    <text x="0" y="410" text-anchor="middle" class="font-serif-title" fill="#ffffff" font-size="46">
      Ngọc Trâm
    </text>

    <!-- Gold Divider Bar with Diamond Center -->
    <g transform="translate(0, 455)">
      <line x1="-160" y1="0" x2="-24" y2="0" stroke="url(#goldBorder)" stroke-width="1.8" stroke-opacity="0.8" />
      <polygon points="0,-6 6,0 0,6 -6,0" fill="#fef08a" />
      <circle cx="-12" cy="0" r="2.5" fill="#d97706" />
      <circle cx="12" cy="0" r="2.5" fill="#d97706" />
      <line x1="24" y1="0" x2="160" y2="0" stroke="url(#goldBorder)" stroke-width="1.8" stroke-opacity="0.8" />
    </g>

    <!-- Refined Subtitle: The Next Station -->
    <text x="0" y="505" text-anchor="middle" class="font-sans-sub" fill="#fcd34d" font-size="18" font-weight="bold">
      THE NEXT STATION
    </text>
  </g>
</svg>